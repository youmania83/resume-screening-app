name: Rison AI Hire - CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Next.js & Server
        run: npm run build

  deploy:
    name: Deploy to Linux VPS
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Connection & Run Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            echo "🚀 Starting deployment to VPS..."
            cd /var/www/resume-screening-app

            # 1. Capture current Git commit hash for potential rollback
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "Current active commit: $PREVIOUS_COMMIT"

            # 2. Pull latest code changes
            git pull origin main

            # 3. Install dependencies and build Next.js
            npm ci
            npm run build

            # 4. Restart server and worker services under PM2
            echo "🔄 Restarting services..."
            pm2 restart ecosystem.config.cjs --env production

            # 4b. One-time pipeline stage migration (populate Under Review / Shortlisted / Interviewing)
            echo "🗄️ Running pipeline stage migration..."
            cd /var/www/resume-screening-app
            node -e "
              require('dotenv').config();
              const { Pool } = require('pg');
              const pool = new Pool({ connectionString: process.env.DATABASE_URL });
              (async () => {
                try {
                  // Restore 5 known interviewing candidates from screenshot
                  const interviewingEmails = [
                    'rajeshh.sharma@hotmail.com',
                    'sharathbabubdn@gmail.com',
                    'vanirameshbabu82@gmail.com',
                    'ashishphilipvarghese@gmail.com',
                    'darshan.j@gmail.com'
                  ];
                  const r1 = await pool.query(
                    \`UPDATE candidates SET status='interviewing', keka_status='HR Interview'
                     WHERE email = ANY(\\\$1::text[]) AND status NOT IN ('rejected')
                     RETURNING name\`,
                    [interviewingEmails]
                  );
                  console.log('Interviewing restored:', r1.rowCount, r1.rows.map(r=>r.name));

                  // Move 10+ yrs experience to Shortlisted (if still applied)
                  const r2 = await pool.query(
                    \`UPDATE candidates SET status='shortlisted'
                     WHERE status='applied' AND CAST(experience_years AS float) >= 10\`
                  );
                  console.log('Moved to Shortlisted:', r2.rowCount);

                  // Move 5-9 yrs experience to Under Review (if still applied)
                  const r3 = await pool.query(
                    \`UPDATE candidates SET status='review'
                     WHERE status='applied' AND CAST(experience_years AS float) >= 5 AND CAST(experience_years AS float) < 10\`
                  );
                  console.log('Moved to Under Review:', r3.rowCount);

                  // Summary
                  const summary = await pool.query(
                    \`SELECT status, COUNT(*)::int as count FROM candidates GROUP BY status ORDER BY count DESC\`
                  );
                  console.table(summary.rows);
                } catch(e) {
                  console.error('Migration error:', e.message);
                } finally {
                  pool.end();
                }
              })();
            " || echo "⚠️ Migration script failed (non-blocking)"

            # 5. Automated Health Check & Verification Loop
            echo "🧪 Verifying service readiness..."
            
            # Wait for backend to boot (e.g. 8 seconds)
            sleep 8
            
            # Check readiness endpoint
            if curl -f http://127.0.0.1:4000/api/health/readiness; then
              echo "✅ Deployment successful and verified healthy!"
            else
              echo "🚨 Health check failed! Initiating rollback to commit $PREVIOUS_COMMIT..."
              git reset --hard $PREVIOUS_COMMIT
              npm ci
              npm run build
              pm2 restart ecosystem.config.cjs --env production
              echo "❌ Rollback complete. Previous stable release restored."
              exit 1
            fi
